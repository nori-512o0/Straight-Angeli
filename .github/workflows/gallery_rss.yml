name: Generate Gallery RSS Feed

on:
  push:
    paths:
      - 'urls.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run feed generator
        run: python generate_gallery_rss.py

      - name: Commit and push generated feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gallery_feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update gallery feed" && git pull --rebase origin main && git push)
